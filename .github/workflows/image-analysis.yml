name: Image-analysis validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: python -m pip install -r requirements-analysis.txt
      - run: ruff check research scripts tests
      - run: pytest -q
      - run: python scripts/validate-image-transfer.py
